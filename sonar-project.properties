# Análisis estático en SonarCloud (ESC-MANT-01). Confirma organization y projectKey en SonarCloud > Information.
sonar.organization=spidersitpverse
sonar.projectKey=SpiderSitpverse_SitpVerseBack
sonar.projectName=SitpVerse Back

sonar.sources=src,prisma
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,**/test/**
sonar.exclusions=**/*.spec.ts,**/test/**,dist/**,node_modules/**,prisma/migrations/**,scripts/**
# lcov.merged.info = pruebas unitarias + pruebas de integración contra el servidor real (ver scripts/merge-coverage.js)
sonar.javascript.lcov.reportPaths=coverage/lcov.merged.info
sonar.coverage.exclusions=**/*.spec.ts,**/test/**,**/*.module.ts,src/main.ts,prisma/**,scripts/**,src/shared/testing/**
sonar.cpd.exclusions=prisma/seed.ts
