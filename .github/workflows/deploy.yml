# Despliegue a Azure App Service. Se ejecuta al hacer push a `main` (o a mano desde la pestaña Actions).
#
# Requiere en GitHub (Settings → Secrets and variables → Actions):
#   Secret   AZURE_WEBAPP_PUBLISH_PROFILE   contenido del "perfil de publicación" del App Service (portal → Get publish profile)
#   Variable AZURE_WEBAPP_NAME              nombre del App Service (p. ej. sitpverse-api)
# La configuración (base de datos, Redis, JWT_SECRET, CORS...) vive en los "Application settings" del App Service,
# NUNCA en el repositorio. Guía completa: docs/DEPLOY.md
name: Deploy a Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false # un despliegue en curso no se interrumpe

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npx --no-install prisma generate
      # Solo se despliega lo que compila y pasa las pruebas
      - run: npx --no-install tsc --noEmit -p .
      - run: npm test
      - run: npm run build

      # Se compila AQUÍ (Linux) y se sube ya construido: el servidor no instala ni compila nada.
      - name: Dejar solo dependencias de producción y regenerar el cliente de Prisma
        run: |
          npm prune --omit=dev
          npx --no-install prisma generate

      - name: Armar el paquete
        run: |
          mkdir deploy
          cp -r dist node_modules prisma package.json package-lock.json deploy/

      - uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy
