version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sitpverse
      POSTGRES_PASSWORD: sitpverse
      POSTGRES_DB: sitpverse
    ports:
      - "5432:5432"
    volumes:
      - sitpverse_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  sitpverse_pgdata:
