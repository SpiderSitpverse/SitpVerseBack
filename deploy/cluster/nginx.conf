# Balanceador del entorno de prueba (equivale al de Azure App Service): round-robin SIN afinidad de sesión.
worker_processes auto;
events { worker_connections 4096; }

http {
  # Resolver de Docker: si una instancia se detiene y vuelve, su nombre se vuelve a resolver.
  resolver 127.0.0.11 valid=2s;

  upstream backend {
    # Detección pasiva de fallas: una instancia que no responde deja de recibir tráfico durante 5 s y se reintenta.
    server api-1:3000 max_fails=1 fail_timeout=5s;
    server api-2:3000 max_fails=1 fail_timeout=5s;
    server api-3:3000 max_fails=1 fail_timeout=5s;
    keepalive 256;
  }

  map $http_upgrade $connection_upgrade { default upgrade; '' ''; }
  # Las pruebas simulan muchos clientes desde una sola máquina mandando su IP en X-Forwarded-For; un cliente real no la
  # manda y se usa la de la conexión. (El balanceador de Azure siempre pone la IP real: ahí no se puede falsificar.)
  map $http_x_forwarded_for $client_ip { default $http_x_forwarded_for; '' $remote_addr; }

  access_log off;

  server {
    listen 80;
    client_max_body_size 6m;

    location / {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $client_ip;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_connect_timeout 1s;
      proxy_read_timeout 60s;
      # Si la instancia elegida no responde, la petición se reintenta en otra (el cliente no ve el fallo).
      proxy_next_upstream error timeout http_502 http_503 non_idempotent;
      proxy_next_upstream_tries 3;
    }
  }
}
